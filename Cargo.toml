[package]
name = "aw-switcher"
version = "0.1.0"
edition = "2024"
description = "Menu bar / tray app to switch a monitor's DDC/CI input source with a global hotkey"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
auto-launch = "0.6.0"
ddc-hi = "0.4.1"
dirs = "6.0.0"
global-hotkey = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
tao = "0.37.0"
toml = "1.1.4"
tray-icon = "0.24.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-foundation-sys = "0.8.7"
# Pinned to match ddc-hi's own ddc-macos dependency exactly: ddc_macos::Monitor::handle()
# returns a core_graphics::display::CGDisplay, and a different crate version would be a
# distinct, incompatible Rust type even though it's structurally the same C type.
core-graphics = "=0.24.0"
io-kit-sys = "0.4.1"
mach2 = "0.4.3"
