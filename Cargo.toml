[package]
name = "aw-switcher"
version = "0.1.0"
edition = "2024"
description = "Menu bar / tray app to switch a monitor's DDC/CI input source with a global hotkey"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
ddc-hi = "0.4.1"
dirs = "6.0.0"
global-hotkey = "0.8.0"
serde = { version = "1.0.229", features = ["derive"] }
tao = "0.37.0"
toml = "1.1.4"
tray-icon = "0.24.2"
