name: build

on:
  workflow_dispatch:
  push:
    branches: [main]
    # tags: ["v*"]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: aw-switcher-macos
            bin: aw-switcher-macos.zip
          - os: windows-latest
            artifact: aw-switcher-windows
            bin: aw-switcher.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.os == 'windows-latest'
        run: cargo build --release
      - if: matrix.os == 'macos-latest'
        run: |
          ./scripts/package-macos.sh
          cd target/release/
          ditto -c -k --sequesterRsrc --keepParent "AW Switcher.app" aw-switcher-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ matrix.bin }}

  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: "build-${{ github.run_number }}"
          name: "AW-Switcher Auto-Build #${{ github.run_number }}"
          generate_release_notes: true
          files: aw-switcher*
